name: One-time CSS formatting

on:
  push:
    branches:
      - final-performance-polish

permissions:
  contents: write

jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[skip css format]')"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          ref: final-performance-polish

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Format CSS
        run: npx --yes prettier@3.6.2 --write styles.css

      - name: Commit formatted CSS
        run: |
          if git diff --quiet -- styles.css; then
            echo "CSS is already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css
          git commit -m "Format CSS for readability [skip css format]"
          git push origin HEAD:final-performance-polish
